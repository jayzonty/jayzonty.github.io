    repo_link_text: GitHub Repo

  - title: Procedural Generation World
    subtitle: Attempting to create a Minecraft-like game

    description: |-
      This project was an attempt to create a Minecraft-like game that utilizes Perlin-noise to procedurally generated voxel worlds.
      The project features the ability to navigate through the world using WASD + mouse controls, and chunk-based terrain generation.

      The application was made using C++ and OpenGL.
