  - title: Procedural Generation World
    subtitle: マインクラフト風voxelゲームの制作試作

    description: |-
      パーリンノイズを利用してプロシージャルにボクセルワールドを生成する、マインクラフト風ゲームの制作試作プロジェクトです。
      WASDキーとマウス操作での移動、およびチャンク単位の地形生成機能を備えています。

      C++とOpenGLを使用して制作しました。
