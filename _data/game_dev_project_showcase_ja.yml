  - title: Memory Management
    subtitle: プロセスへのメモリ割り当てを題材にしたゲーム

    description: |-
      OSがPC上で実行されるプロセスにメモリを割り当てる仕組みをシミュレーションしたゲームです。
      プレイヤーは各プロセスのメモリ要件と処理時間に応じて、どのプロセスをRAMに割り当てるかを判断します。

      初めて参加したゲームジャム作品で、2週間で制作し、[itch.io](https://itch.io) の「[My First Game Jam: Winter 2018](https://itch.io/jam/my-first-game-jam-winter-2018)」に提出しました。

      [Unity](https://unity.com/)ゲームエンジンを使用して制作しました。

    image: /img/memory-management.gif
    image_ratio: is-3by2
    link: https://jayzonty.itch.io/memory-management
    link_text: ブラウザでプレイ (itch.io)
    tags: Unity,C#
    repo_link: https://github.com/jayzonty/MemoryManagement
    repo_link_text: GitHubリポジトリ

  - title: Marching Cubes
    subtitle: マーチングキューブ法アルゴリズムの学習プロジェクト

    description: |-
      3D世界のプロシージャル生成に使われるコンピュータグラフィックスのアルゴリズム「マーチングキューブ法（Marching Cubes）」を学ぶためのプロジェクトです。
      WASDキーとマウス操作で生成されたワールド内を移動できます。

      C++とOpenGLを使用して制作しました。
